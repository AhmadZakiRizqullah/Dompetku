name: dompetku_tracker
description: Aplikasi pencatatan keuangan pribadi offline-first dengan Flutter & Drift.
publish_to: 'none'
version: 1.1.0+3

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # User Preferences
  shared_preferences: ^2.2.3

  # Local Database (Drift SQLite)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # UI, Fonts & Charts
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  intl: ^0.19.0

  # Excel & PDF Processing
  excel: ^4.0.3
  pdf: ^3.10.8
  printing: ^5.12.0

  # File Handling & Sharing
  file_picker: ^8.0.3
  share_plus: ^9.0.0

  # Utilities
  uuid: ^4.4.0
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code Generators for Drift & Riverpod
  drift_dev: ^2.18.0
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/logo.jpg"
  min_sdk_android: 21
